[phases.setup]
nixPkgs = ["python311", "nodejs_20"]

[phases.install]
cmds = [
  "cd frontend && npm ci",
  "cd backend && python -m venv /opt/venv && /opt/venv/bin/pip install -r requirements.txt"
]

[phases.build]
cmds = [
  "cd frontend && npm run build",
  "cd backend && /opt/venv/bin/python manage.py collectstatic --noinput"
]

[start]
cmd = "cd backend && /opt/venv/bin/python manage.py migrate --noinput && /opt/venv/bin/gunicorn inventory.wsgi:application --bind 0.0.0.0:$PORT --workers 2"
